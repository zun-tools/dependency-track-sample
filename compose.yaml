# Dependency-Track v5.2.2（公式 quickstart の compose をもとに、版を 5.2.2 に固定・ポートは 127.0.0.1 のみ）
name: dtsample

services:
  apiserver:
    image: ghcr.io/dependencytrack/apiserver:5.2.2
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      DT_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/dtrack"
      DT_DATASOURCE_USERNAME: "dtrack"
      DT_DATASOURCE_PASSWORD: "${DT_DB_PASSWORD:-dtrack}"
      DT_TELEMETRY_SUBMISSION_DEFAULT_ENABLED: "false"
    ports:
    - "127.0.0.1:${DT_API_PORT:-8080}:8080"
    volumes:
    - "apiserver-data:/data"
    restart: unless-stopped

  frontend:
    image: ghcr.io/dependencytrack/frontend:5.2.2
    environment:
      API_BASE_URL: "http://localhost:${DT_API_PORT:-8080}"
    ports:
    - "127.0.0.1:${DT_UI_PORT:-8081}:8080"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "dtrack"
      POSTGRES_USER: "dtrack"
      POSTGRES_PASSWORD: "${DT_DB_PASSWORD:-dtrack}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
    - "postgres-data:/var/lib/postgresql"

volumes:
  apiserver-data: {}
  postgres-data: {}
